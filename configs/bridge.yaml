# Settings for bridge content generation (streamlit run streamlit_app.py and
# python -m bridge.run).
# Paths are relative to the repository root.

paths:
  gap_matrix: processed/gap/gap_matrix.csv                             # Phase 4 output
  topic_matches: processed/alignment/bge-large-en-v1.5/topic_matches.csv  # NCERT matches per topic
  topics: processed/topics.jsonl                                       # full text of every topic
  thresholds: processed/alignment/thresholds.json                      # t_partial: below it, no NCERT passages
  output_dir: processed/bridge                                         # drafts, approved packs, index.csv
  secrets: .streamlit/secrets.toml                                     # API keys (git-ignored)
  prompt_cache: cache/bridge_prompts                                   # bridge.run --dry-run prompts (git-ignored)

sources:
  ncert_matches: 2        # closest NCERT topics shown to the model as "what the child knows"
  max_scert_chars: 6000   # SCERT topic text is cut at a sentence end past this length
  max_ncert_chars: 2500   # same, per NCERT topic

generation:
  # null = not sent. Current defaults ignore or reject it: Gemini 3.6+ ignores custom values,
  # Claude Haiku 5.5 says to omit it, OpenAI reasoning models reject it. A number is sent to
  # Gemini and Anthropic only (retried once without it if the model rejects it).
  temperature: null
  max_tokens: 8192        # thinking/reasoning models count their reasoning against this
  timeout_s: 180
  retries: 4              # bridge.run only: retries on 429 / 5xx / network errors, with backoff

default_provider: anthropic   # bridge.run --provider default, and the app's first choice

# Default model per provider. Model IDs change often: use "List models" in the app to pick
# another one available to your key.
providers:
  gemini:
    label: Google Gemini
    model: gemini-3.8-flash
    env: GEMINI_API_KEY
  openai:
    label: OpenAI
    model: gpt-6-luna
    env: OPENAI_API_KEY
  anthropic:
    label: Anthropic Claude
    model: claude-haiku-5-5
    env: ANTHROPIC_API_KEY
