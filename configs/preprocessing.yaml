# Settings for the topic preprocessing pipeline (python -m preprocessing.run).
# Paths are relative to the repository root.

paths:
  input_root: data            # <input_root>/<BOARD>/[Class<N>/]<file>.pdf
  page_cache: cache/pages     # per-PDF page extraction (incl. OCR), reused between runs
  output_dir: processed       # chunks.jsonl, topics.jsonl, dropped_topics.jsonl, summary.csv
  exclude_stems: "1ps$"       # regex on file name; NCERT *1ps.pdf = prelims (cover, foreword, contents)
  default_grade: 6            # class of PDFs with no Class<N> folder and no NCERT code (SCERT Term_*.pdf)

extraction:
  min_native_chars: 50        # a page with fewer selectable characters is OCR'd
  ocr_dpi: 300
  ocr_lang: eng               # add "+hin" if Hindi-medium books are added (needs hin.traineddata)
  tesseract_cmd: null         # null = find tesseract on PATH or in the default Windows install dir
  workers: 7                  # parallel OCR processes

segmentation:
  heading_size_ratio: 1.10    # heading if line size >= ratio * the document's body text size
  max_heading_chars: 60
  min_topic_chars: 300        # shorter topics are merged into their neighbour

cleaning:
  max_chunk_chars: 1200       # long topics are split into chunks of at most this size
  min_kept_chars: 150         # after cleaning, shorter topics are dropped
  min_alpha_ratio: 0.55       # letters / non-space characters
  min_word_quality: 0.70      # share of tokens that look like real words
